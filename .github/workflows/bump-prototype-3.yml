name: Bump Prototype 3 Revision

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increment Prototype 3 sub-version
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'prototype-3/version.js';
          const source = fs.readFileSync(path, 'utf8');
          const match = source.match(/PROTOTYPE_VERSION = '3\.(\d+)'/);
          if (!match) throw new Error('Prototype 3 version was not found');
          const next = Number(match[1]) + 1;
          const version = `3.${next}`;
          fs.writeFileSync(path, source.replace(match[0], `PROTOTYPE_VERSION = '${version}'`));

          const selectorPath = 'index.html';
          const selector = fs.readFileSync(selectorPath, 'utf8')
            .replace(/id="prototype3Badge">03\.\d+</, `id="prototype3Badge">0${version}<`)
            .replace(/id="prototype3Title">ПРОТОТИП 3\.\d+</, `id="prototype3Title">ПРОТОТИП ${version}<`);
          fs.writeFileSync(selectorPath, selector);

          const prototypePath = 'prototype-3/index.html';
          const prototype = fs.readFileSync(prototypePath, 'utf8')
            .replace(/id="prototypeVersion">PROTOTYPE 3\.\d+</, `id="prototypeVersion">PROTOTYPE ${version}<`);
          fs.writeFileSync(prototypePath, prototype);
          fs.writeFileSync('/tmp/prototype-version', `3.${next}`);
          NODE

      - name: Commit revision number
        run: |
          VERSION=$(cat /tmp/prototype-version)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype-3/version.js prototype-3/index.html index.html
          git commit -m "chore: bump prototype to ${VERSION} [skip ci]"
          git push
